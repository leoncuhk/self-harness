[project]
name = "agentic-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "langchain-openai",
]

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 420
