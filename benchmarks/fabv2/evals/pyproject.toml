[project]
name = "fabv2-evals"
version = "0.1.0"
description = "FAB v2 smoke evals for the self-harness loop"
requires-python = ">=3.12,<3.14"
dependencies = [
    "model-library==0.1.25",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "simpleeval>=1.0",
]

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
