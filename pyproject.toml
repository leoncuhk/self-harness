[project]
name = "better-harness"
version = "0.1.0"
description = "Small eval-driven harness optimizer for agent systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.5",
    "langchain-openai>=1.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[project.scripts]
better-harness = "better_harness:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["better_harness_plugin"]

[tool.setuptools.packages.find]
include = ["better_harness*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".runtime/**", "**/_runtime/**", "examples/**", "runs/**", "benchmarks/agentic/workspace/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "C901",
    "COM812",
    "D203",
    "D102",
    "D213",
    "D107",
    "E501",
    "EM102",
    "ISC001",
    "PERF401",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "Q000",
    "S314",
    "S603",
    "S607",
    "TC001",
    "TC003",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",
    "ANN201",
    "D",
    "S101",
    "TC002",
    "TC003",
]
"better_harness/core.py" = ["PLC0415", "T201", "S101"]
"scripts/**" = ["T201", "S101", "D103", "INP001", "PLC0415", "PLR2004", "C901", "PLR0912", "PLR0915", "FBT001", "FBT002", "S311"]
"benchmarks/**" = ["INP001", "S101", "D100", "D103", "T201", "PLC0415", "DTZ007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds the artifact auditor, which is itself under test.
pythonpath = [".", "scripts"]
