# Fixed hand-engineered prompt comparator; no outer-loop evolution.
# Public-27 is adaptive development data, not a locked or official test.

[experiment]
name = "fabv2-public27-b5-v1"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 0
repeats = 3
gate = "objective"
candidates = 1
fingerprint_discipline = "strict"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.01
require_no_pass_regression = true

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 1

[guards]
enabled = true

[budget]
enabled = true

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--max-turns=16", "--max-time=900", "--max-tokens=8000"]
case_timeout_s = 1020

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/prompt_v2.txt"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q001]"
split = "train"
stratum = "general-qualitative"

