# Pre-registered Public-27 development run. All 27 questions and rubrics are
# public; "holdout" means adaptive validation, not a locked or private test.
# This is intentionally expensive: 27 cases x 3 repeats per evaluated variant.

[experiment]
name = "fabv2-public27-self-harness-v1"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 2
repeats = 3
gate = "objective"
candidates = 2
fingerprint_discipline = "strict"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.01
require_no_pass_regression = true

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 60

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.25
max_latency_growth = 1.25
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--max-turns=16", "--max-time=900", "--max-tokens=8000"]
case_timeout_s = 1020

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/workspace/prompt.txt"

[surfaces.research_policy]
kind = "workspace_file"
target = "research_policy.md"
filename = "research_policy.md"
base_file = "../benchmarks/fabv2/workspace/research_policy.md"

[surfaces.verification_policy]
kind = "workspace_file"
target = "verification_policy.md"
filename = "verification_policy.md"
base_file = "../benchmarks/fabv2/workspace/verification_policy.md"

[surfaces.submission_policy]
kind = "workspace_file"
target = "submission_policy.md"
filename = "submission_policy.md"
base_file = "../benchmarks/fabv2/workspace/submission_policy.md"

