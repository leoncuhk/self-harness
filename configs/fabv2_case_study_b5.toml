# Equal-budget hand-engineered comparator for the FAB v2 case study.

[experiment]
name = "fabv2-case-study-b5"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 1
repeats = 1
gate = "objective"
candidates = 1
fingerprint_discipline = "report"

[goal]
primary_metric = "score"
direction = "maximize"
min_delta = 0.01

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 60

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--max-turns=8", "--max-time=360", "--max-tokens=5000"]
case_timeout_s = 480

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/prompt_v2.txt"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q012]"
split = "holdout"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q019]"
split = "scorecard"
stratum = "calc-heavy"
