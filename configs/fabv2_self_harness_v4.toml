# V4 preregistration: V3 apparatus + two explicit uncensoring switches.
#
# Justification (pre-registered before any V4 outcome): the executed public-6
# B0/B5 baselines (runs/fabv2-b0, runs/fabv2-b5) show censoring is the dominant
# failure mode — 4/6 and 5/6 rollouts ended at max_turns/max_time with EMPTY
# final answers, scoring 0.000 regardless of the numeric coverage achieved
# (q012 reached 6/6 criteria coverage with no submission). In a censored regime
# every candidate measures Δ=0 and the gate cannot learn. V4 therefore changes
# only the harness-side submission discipline:
#   - budget-aware TextInputs at 2-turns/1-turn/120s remaining;
#   - a recovery phase (at most 3 turns / 120s, submit_final_result as the ONLY
#     tool) when a rollout ends censored with an empty answer.
# Neither reads new information nor touches the evaluator: uncensoring converts
# censored zeros into the model's best-available partial answers so the
# objective has variance. Success criterion for the seed arm (Stage 0 gate):
# >= 5/6 cases produce non-empty submissions. V4 inherits everything else from
# V3 (14-turn/900s/8000-token budget, ungated_credit objective, same cases).

[experiment]
name = "fabv2-self-harness-v4"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 1
repeats = 1
gate = "objective"
candidates = 1
fingerprint_discipline = "report"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.01
require_no_pass_regression = true

[[goal.constraints]]
metric = "rubric_numeric_coverage"
minimum = 0.75

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 60

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.5
max_latency_growth = 1.5
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--timeout=1050", "--max-turns=14", "--max-time=900", "--max-tokens=8000"]
# Keep the outer process timeout above the agent budget so a clean task failure
# is measured instead of being censored as apparatus.
case_timeout_s = 1080

[runner.pytest.env]
FABV2_BUDGET_MESSAGES = "1"
FABV2_RECOVERY_SUBMIT = "1"
FABV2_RECOVERY_MAX_TURNS = "3"
FABV2_RECOVERY_MAX_TIME = "120"

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/workspace/prompt.txt"

[surfaces.research_policy]
kind = "workspace_file"
target = "research_policy.md"
filename = "research_policy.md"
base_file = "../benchmarks/fabv2/workspace/research_policy.md"

[surfaces.verification_policy]
kind = "workspace_file"
target = "verification_policy.md"
filename = "verification_policy.md"
base_file = "../benchmarks/fabv2/workspace/verification_policy.md"

[surfaces.submission_policy]
kind = "workspace_file"
target = "submission_policy.md"
filename = "submission_policy.md"
base_file = "../benchmarks/fabv2/workspace/submission_policy.md"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q012]"
split = "holdout"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q019]"
split = "scorecard"
stratum = "calc-heavy"
