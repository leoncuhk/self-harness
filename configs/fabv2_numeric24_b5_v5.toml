# Fixed hand-engineered comparator for Numeric-24 V5. It uses the identical
# model, cases, repeats, execution budget, and recovery contract as V5.

[experiment]
name = "fabv2-numeric24-b5-v5"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 0
repeats = 3
gate = "objective"
candidates = 1
fingerprint_discipline = "strict"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.03
require_no_pass_regression = true
require_holdout_improvement = true

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 1

[guards]
enabled = true

[budget]
enabled = true
max_cost_growth = 1.25
max_latency_growth = 1.25
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--timeout=1050", "--max-turns=14", "--max-time=900", "--max-tokens=8000"]
case_timeout_s = 1080

[runner.pytest.env]
FABV2_BUDGET_MESSAGES = "1"
FABV2_RECOVERY_SUBMIT = "1"
FABV2_RECOVERY_MAX_TURNS = "3"
FABV2_RECOVERY_MAX_TIME = "120"

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/prompt_v2.txt"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "general-quantitative"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q005]"
split = "holdout"
stratum = "general-quantitative"

