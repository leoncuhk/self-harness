# Successor to the executed v2 calibration. V2 showed that an eight-turn budget
# yields empty submissions on all measured arms, so V3 changes only the frozen
# execution budget before any V3 outcome is observed.

[experiment]
name = "fabv2-self-harness-v3"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 1
repeats = 1
gate = "objective"
candidates = 1
fingerprint_discipline = "report"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.01
require_no_pass_regression = true

[[goal.constraints]]
metric = "rubric_numeric_coverage"
minimum = 0.75

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 60

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.5
max_latency_growth = 1.5
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--max-turns=14", "--max-time=900", "--max-tokens=8000"]
# Keep the outer process timeout above the agent budget so a clean task failure
# is measured instead of being censored as apparatus.
case_timeout_s = 1080

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/workspace/prompt.txt"

[surfaces.research_policy]
kind = "workspace_file"
target = "research_policy.md"
filename = "research_policy.md"
base_file = "../benchmarks/fabv2/workspace/research_policy.md"

[surfaces.verification_policy]
kind = "workspace_file"
target = "verification_policy.md"
filename = "verification_policy.md"
base_file = "../benchmarks/fabv2/workspace/verification_policy.md"

[surfaces.submission_policy]
kind = "workspace_file"
target = "submission_policy.md"
filename = "submission_policy.md"
base_file = "../benchmarks/fabv2/workspace/submission_policy.md"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q012]"
split = "holdout"
stratum = "calc-heavy"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q019]"
split = "scorecard"
stratum = "calc-heavy"
