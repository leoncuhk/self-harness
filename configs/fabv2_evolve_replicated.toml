# Replicated Public-24 development loop. Candidates are selected on three
# stochastic repeats; the one-case smoke contract is mechanism-only and cannot
# satisfy a domain-level promotion claim.

extends = "fabv2.toml"

[experiment]
name = "fabv2-evolve-replicated-v1"
max_iterations = 3
repeats = 3
candidates = 2

[measurement]
enabled = true
confidence = 0.95
bootstrap_samples = 10000
minimum_pairs = 4
seed = 0
