# Cheap Prime-inner integration gate. It does not run evolution or support an efficacy claim.

[experiment]
name = "fabv2-smoke-v1"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "self-harness/deepseek-v4-flash"
max_iterations = 0
repeats = 1
gate = "objective"
candidates = 1
fingerprint_discipline = "strict"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.03
require_no_pass_regression = true
require_holdout_improvement = true

[better_agent]
backend = "pi"
command = "pi"
model = "self-harness/deepseek-v4-flash"
max_turns = 1
max_tokens = 60000
timeout_s = 300
extensions = ["../benchmarks/fabv2/workspace/model_provider.ts"]

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.25
max_latency_growth = 1.25
min_latency_s = 10.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--max-turns=14", "--max-time=300", "--max-tokens=150000"]
case_timeout_s = 360

[surfaces.system]
kind = "workspace_file"
target = "system.md"
filename = "system.md"
base_file = "../benchmarks/fabv2/harnesses/strong/system.md"

[surfaces.orchestration]
kind = "workspace_file"
target = "orchestration.md"
filename = "orchestration.md"
base_file = "../benchmarks/fabv2/harnesses/strong/orchestration.md"

[surfaces.tools]
kind = "workspace_file"
target = "tools.md"
filename = "tools.md"
base_file = "../benchmarks/fabv2/harnesses/strong/tools.md"

[surfaces.research]
kind = "workspace_file"
target = "research.md"
filename = "research.md"
base_file = "../benchmarks/fabv2/harnesses/strong/research.md"

[surfaces.evidence]
kind = "workspace_file"
target = "evidence.md"
filename = "evidence.md"
base_file = "../benchmarks/fabv2/harnesses/strong/evidence.md"

[surfaces.subagents]
kind = "workspace_file"
target = "subagents.md"
filename = "subagents.md"
base_file = "../benchmarks/fabv2/harnesses/strong/subagents.md"

[surfaces.verification]
kind = "workspace_file"
target = "verification.md"
filename = "verification.md"
base_file = "../benchmarks/fabv2/harnesses/strong/verification.md"

[surfaces.submission]
kind = "workspace_file"
target = "submission.md"
filename = "submission.md"
base_file = "../benchmarks/fabv2/harnesses/strong/submission.md"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "general-quantitative"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q005]"
split = "holdout"
stratum = "general-quantitative"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q006]"
split = "scorecard"
stratum = "general-quantitative"
