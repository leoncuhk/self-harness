# Amended MVP suite (MVP.md Amendment 1): 16 authored agentic tasks,
# real deepseek-v4-flash inner agent, deterministic pytest verifiers.

[experiment]
name = "agentic-mvp2"
runner = "pytest"
workspace_root = "../benchmarks/agentic/workspace"
model = "openai:gpt-4.1-nano"
max_iterations = 5
repeats = 3
gate = "conservative"
candidates = 1

[better_agent]
model = "openai:deepseek-v4-flash"
max_turns = 100

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.5
max_latency_growth = 1.5
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/agentic/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q"]

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_value = """
You are a helpful agent. Complete the task in the task directory.
"""

[surfaces.tools]
kind = "workspace_file"
target = "tools.py"
filename = "tools.py"
base_value = '''
"""Editable tool surface.

Contract: define make_tools(task_root: str) -> list of LangChain tools. They are
added to the agent alongside its built-in filesystem tools (ls, read_file,
write_file, edit_file), which are always available and rooted at the task
directory. Return [] for no extra tools.
"""


def make_tools(task_root: str) -> list:
    del task_root
    return []
'''

[surfaces.skills]
kind = "workspace_file"
target = "skills.md"
filename = "skills.md"
base_value = """
# Skills

Be generally helpful.
"""

[surfaces.middleware]
kind = "workspace_file"
target = "middleware.py"
filename = "middleware.py"
base_value = '''
"""Editable middleware surface.

Contract: define MIDDLEWARE as a list of LangChain agent middleware objects
(e.g. functions decorated with @wrap_tool_call / @wrap_model_call from
langchain.agents.middleware). They are passed to create_deep_agent(middleware=...).
Leave empty for none.
"""

MIDDLEWARE: list = []
'''

