# FAB v2 Public Numeric-24 V5.
#
# This is an adaptive public-development experiment, not an official Vals run.
# The three questions without a usable local numeric objective (q001-q003) are
# excluded rather than silently scored as permanent zeros. For each of the eight
# numeric-capable categories, one question is visible train, one is adaptive
# validation, and one is a locked scorecard. The scorecard must remain unread
# until the final harness has been selected.

[experiment]
name = "fabv2-numeric24-self-harness-v5"
runner = "pytest"
workspace_root = "../benchmarks/fabv2/workspace"
model = "openai/deepseek-v4-flash"
max_iterations = 3
repeats = 3
gate = "objective"
candidates = 1
fingerprint_discipline = "strict"

[goal]
primary_metric = "ungated_credit"
direction = "maximize"
min_delta = 0.03
require_no_pass_regression = true
# Train-only gains are adaptation, not evidence of general harness improvement.
require_holdout_improvement = true

[better_agent]
model = "openai/deepseek-v4-flash"
max_turns = 60

[guards]
enabled = true
max_growth = 3.0
min_bloat_bytes = 4096

[budget]
enabled = true
max_cost_growth = 1.25
max_latency_growth = 1.25
min_latency_s = 30.0

[runner.pytest]
project_root = "../benchmarks/fabv2/evals"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "--timeout=1050", "--max-turns=14", "--max-time=900", "--max-tokens=8000"]
case_timeout_s = 1080

[runner.pytest.env]
FABV2_BUDGET_MESSAGES = "1"
FABV2_RECOVERY_SUBMIT = "1"
FABV2_RECOVERY_MAX_TURNS = "3"
FABV2_RECOVERY_MAX_TIME = "120"

[surfaces.prompt]
kind = "workspace_file"
target = "prompt.txt"
filename = "prompt.txt"
base_file = "../benchmarks/fabv2/workspace/prompt.txt"

# Empty policy surfaces keep the seed byte-for-byte equivalent to the official
# prompt while allowing the outer loop to create orthogonal policies.
[surfaces.research_policy]
kind = "workspace_file"
target = "research_policy.md"
filename = "research_policy.md"
base_value = ""

[surfaces.verification_policy]
kind = "workspace_file"
target = "verification_policy.md"
filename = "verification_policy.md"
base_value = ""

[surfaces.submission_policy]
kind = "workspace_file"
target = "submission_policy.md"
filename = "submission_policy.md"
base_value = ""

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q004]"
split = "train"
stratum = "general-quantitative"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q005]"
split = "holdout"
stratum = "general-quantitative"

[[cases]]
case_id = "tests/test_fabv2.py::test_question[q006]"
split = "scorecard"
stratum = "general-quantitative"

